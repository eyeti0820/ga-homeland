<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家园 · 便签墙</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="wall-vignette" aria-hidden="true"></div>

<header class="wall-head">
  <div class="head-left">
    <h1 class="wall-title">家<span>园</span>便签墙</h1>
    <p class="wall-sub">写句话贴上来，他们会看到的</p>
  </div>
  <div class="head-right" id="presence">…</div>
  <a class="to-diary to-diary-top" href="moments.html" title="去朋友圈">📷 朋友圈</a>
  <a class="to-diary to-diary-top" href="diary.html" title="去他们的日记本">📖 日记本</a>
     <a class="to-diary to-diary-top" href="forum.html" title="去论坛">💬 论坛</a>
</header>

<section class="composer" id="composer">
  <div class="composer-card">
    <textarea id="note-input" rows="2" maxlength="500"
      placeholder="给家里留句话……（署名：小墨）"></textarea>
    <div class="composer-bar">
      <div class="swatches" id="swatches" title="选一张纸的颜色"></div>
      <button id="post-btn" class="btn-pin">贴上去</button>
    </div>
  </div>
</section>

<main class="wall" id="wall" aria-live="polite">
  <p class="wall-empty" id="wall-empty">墙上还空着，来贴第一张吧</p>
</main>

<div class="sentinel" id="sentinel" hidden></div>

<footer class="wall-foot">
  <span id="wall-meta">—</span>
  <a class="to-diary" href="moments.html">📷 朋友圈 →</a>
  <a class="to-diary" href="diary.html">📖 交换日记 →</a>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
