<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111118">   <!-- 审计P2-7②: 与manifest对齐 -->
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overscroll-behavior:none}html{background:#f7f7f7}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#f7f7f7;color:#111;
     display:flex;justify-content:center}
/* iOS standalone下100dvh不含home条区(1027实测矮~58pt): 改position:fixed钉满整窗, fixed坐标系覆盖unsafe区, 消灭底部死区 */
#app{width:100%;max-width:720px;position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;display:flex;flex-direction:column;background:#f7f7f7}
/* ---------- 列表屏 ---------- */
#listScreen{display:flex;flex-direction:column;height:100%}
.screen-header{background:#ededed;padding:14px 16px 10px;font-size:17px;font-weight:600;text-align:center;
  border-bottom:1px solid #dcdcdc;flex:none;padding-top:calc(14px + env(safe-area-inset-top))}
.searchbox{padding:8px 12px;background:#ededed;flex:none}
.searchbox input{width:100%;border:none;border-radius:6px;background:#fff;height:30px;padding:0 10px;
  font-size:14px;outline:none}
#charList{flex:1;overflow-y:auto;background:#fff;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.char-row{display:flex;align-items:center;padding:10px 12px;gap:10px;cursor:pointer}
.char-row:active{background:#e5e5e5}
.char-row+.char-row{border-top:1px solid #f2f2f2}
.avatar{width:44px;height:44px;border-radius:6px;color:#fff;font-size:18px;display:flex;align-items:center;
  justify-content:center;flex:none;font-weight:600}
.avatarImg{width:100%;height:100%;border-radius:6px;object-fit:cover;display:block}   /* 切片5: 图片头像 */
.crow-mid{flex:1;min-width:0}
.crow-name{font-size:16px;font-weight:500}
.crow-preview{font-size:13px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-preview.typing{color:#5b8def}
.crow-right{text-align:right;flex:none;align-self:flex-start;margin-top:2px}
.crow-time{font-size:11px;color:#b2b2b2}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#fa5151;color:#fff;
  font-size:11px;line-height:18px;text-align:center;margin-top:5px;padding:0 5px}
/* ---------- 聊天屏 ---------- */
#chatScreen{display:none;flex-direction:column;height:100%}
#chatHeader{background:#ededed;padding:12px 12px 10px;display:flex;align-items:center;gap:8px;flex:none;
  border-bottom:1px solid #dcdcdc;padding-top:calc(12px + env(safe-area-inset-top))}
#backBtn{font-size:26px;color:#111;cursor:pointer;padding:0 4px;line-height:1;flex:none}
#chatTitle{flex:1;font-size:17px;font-weight:600}
#typingHint{font-size:12px;color:#888;display:none}
#typingHint .d{animation:blink 1.2s infinite}
#typingHint .d:nth-child(2){animation-delay:.2s}#typingHint .d:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
#msgArea{flex:1;overflow-y:auto;padding:12px 12px 6px}
.time-pill{text-align:center;margin:10px 0}
.time-pill span{font-size:11px;color:#b2b2b2;background:#e0e0e0;border-radius:4px;padding:2px 6px}
.sys-pill{text-align:center;margin:10px 0}
.sys-pill span{font-size:12px;color:#fff;background:#c8c8c8;border-radius:4px;padding:3px 8px}
.row{display:flex;margin:14px 0;gap:8px;align-items:flex-start}
.row.user{flex-direction:row-reverse}
.row .avatar{width:38px;height:38px;font-size:15px;border-radius:5px}
.bubbles{max-width:72%;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.row.user .bubbles{align-items:flex-end}
.bubble{background:#fff;border-radius:8px;padding:9px 12px;font-size:15.5px;line-height:1.45;
  word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.04);animation:pop .18s ease-out;
  max-width:100%;width:fit-content;box-sizing:border-box}
.row.user .bubble{background:#95ec69}
.bubble.paren{color:#5c4c38;font-size:13.5px;line-height:2.0;margin:2px 4px;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(180,150,110,.22) 27px 28px),linear-gradient(145deg,#fcf8ec,#f3e8d0);
  border:1px solid #e1d3b7;border-left:3px solid #c9b48c;border-radius:4px 8px 8px 4px;
  box-shadow:0 2px 5px rgba(130,105,70,.12),inset 0 0 12px rgba(215,190,150,.25);
  padding:10px 14px 10px 16px}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:scale(1);opacity:1}}
#inputBar{flex:none;background:#f7f7f7;border-top:1px solid #dcdcdc;padding:8px 10px;display:flex;
  gap:8px;align-items:flex-end;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
/* ---- M3媒体 ---- */
#plusBtn{flex:none;width:32px;height:32px;min-width:32px;border-radius:50%;border:1.5px solid #bbb;
  color:#888;font-size:20px;line-height:29px;text-align:center;cursor:pointer;user-select:none;background:#fff}
#attBar{flex:none;display:none;flex-wrap:wrap;gap:6px;padding:6px 10px;background:#f7f7f7}
#attBar .att{position:relative;width:54px;height:54px}
#attBar .att img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
#attBar .att .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer}
.bubble img.pic{max-width:180px;max-height:240px;border-radius:6px;display:block;cursor:zoom-in}
.bubble.audio{display:flex;align-items:center;gap:10px;min-width:170px}
.vbtn{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:#d89e94;color:#fff;
  font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.vbtn:active{transform:scale(.92)}
.vtrack{flex:1;height:4px;border-radius:2px;background:rgba(190,140,130,.28);position:relative;cursor:pointer;overflow:hidden}
.vfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#d89e94}
.vdur{font-size:12px;color:#c4837a;min-width:22px;text-align:right}
.row.user .vbtn{background:rgba(255,255,255,.94)}
.row.user .vfill{background:#fff}
.row.user .vtrack{background:rgba(255,255,255,.45)}
.row.user .vdur{color:rgba(255,255,255,.95)}
.cap{font-size:11px;color:#999;margin:2px 2px 0;max-width:180px}
#imgOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;
  align-items:center;justify-content:center}
#imgOverlay img{max-width:96vw;max-height:96vh}
#msgInput{flex:1;border:none;border-radius:6px;background:#fff;padding:9px 10px;font-size:15.5px;
  line-height:1.4;resize:none;outline:none;max-height:96px;font-family:inherit}
#sendBtn{flex:none;border:none;border-radius:6px;background:#07c160;color:#fff;font-size:15px;
  padding:9px 16px;cursor:pointer}
#sendBtn:disabled{background:#9fd6b5}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;
  font-size:14px;border-radius:8px;padding:10px 18px;display:none;z-index:99}
#wbBtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:19px;cursor:pointer;line-height:1}
.screen-header{position:relative}
#wbScreen{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:50}
#wbText{flex:1;margin:12px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:15px;
  line-height:1.6;resize:none;font-family:inherit;outline:none}
#wbBar{display:flex;gap:10px;padding:0 12px 14px}
#wbBar button{flex:1;border:none;border-radius:6px;padding:11px 0;font-size:16px}
#wbCancel{background:#f2f2f2;color:#111}
#wbSave{background:#07c160;color:#fff}
#wbSave:disabled{background:#9fd6b5}
/* ---------- M4: 设置面板/背景/错误重试 ---------- */
#cfgBtn{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:17px;cursor:pointer;line-height:1}
#chatHeader{position:relative}
#cfgScreen{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:60}
#cfgPanel{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(92vw,380px);background:#fff;border-radius:12px;padding:14px;font-size:14px;color:#111}
#cfgPanel h4{margin:0 0 10px;font-size:15px}
.bgRow{display:flex;gap:8px}
.bgOpt{flex:1;border:1px solid #ddd;border-radius:8px;padding:9px 0;text-align:center;cursor:pointer;font-size:13px;color:#555}
.bgOpt.on{border-color:#07c160;color:#07c160;font-weight:600}
#bgImgBtn{width:100%;border:none;border-radius:8px;padding:10px;background:#f2f2f2;margin-top:10px;font-size:13px;cursor:pointer}
#cfgDone{border:none;border-radius:6px;padding:9px 22px;background:#07c160;color:#fff;font-size:14px;cursor:pointer}
.errPill{cursor:pointer;background:#ffe9e9;color:#d64545;font-weight:500}
/* ---- 切片7: 长按/上下文操作菜单 ---- */
#msgContextMenu{position:fixed;display:none;z-index:150;background:rgba(40,40,40,.92);backdrop-filter:blur(10px);border-radius:8px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateX(-50%)}
.ctx-btn{border:none;background:transparent;color:#fff;font-size:13.5px;padding:6px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none}
.ctx-btn:active{background:rgba(255,255,255,.18)}
.ctx-btn.del{color:#ff6b6b}
#ctxMask{position:fixed;inset:0;z-index:149;display:none;background:transparent}
</style>

<body>
<div id="app">
  <div id="listScreen">
    <div class="screen-header">Chat<span id="wbBtn" onclick="openWb()">📖</span></div>
    <div class="searchbox"><input id="searchInput" placeholder="搜索" oninput="renderList()"></div>
    <div id="charList"></div>
  </div>
  <div id="chatScreen">
    <div id="chatHeader">
      <div id="backBtn" onclick="closeChat()">‹</div>
      <div id="chatTitle"></div>
      <div id="typingHint">正在输入<span class="d">.</span><span class="d">.</span><span class="d">.</span></div>
      <span id="cfgBtn" onclick="openCfg()">⚙️</span>
      <div class="avatar" id="chatAvatar" style="width:34px;height:34px;font-size:14px"></div>
    </div>
    <div id="msgArea"></div>
    <div id="attBar"></div>
    <div id="inputBar">
      <div id="plusBtn" onclick="pickImg()" title="发图片">＋</div>
      <textarea id="msgInput" rows="1" oninput="autoGrow(this)" onkeydown="inputKey(event)"></textarea>
      <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onPicked(this)">
    <div id="imgOverlay" onclick="this.style.display='none'"><img id="imgBig" alt=""></div>
    <div id="cfgScreen" onclick="if(event.target===this)closeCfg()">
      <div id="cfgPanel">
        <h4>会话背景 <span style="font-size:12px;color:#888;font-weight:400">按角色独立设置</span></h4>
        <div id="bgCharRow" style="margin-bottom:6px"></div>
        <div class="bgRow">
          <div class="bgOpt" id="bgNone" onclick="bgMode('none')">无</div>
          <div class="bgOpt" id="bgImgOpt" onclick="bgMode('image')">自定义图</div>
        </div>
        <button id="bgImgBtn" onclick="$('bgImgFile').click()">选择图片…</button>
        <input type="file" id="bgImgFile" accept="image/*" style="display:none" onchange="bgImgPick(this)">
        <div style="text-align:right;margin-top:12px"><button id="cfgDone" onclick="closeCfg()">完成</button></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="ctxMask" onclick="closeCtxMenu()"></div>
<div id="msgContextMenu">
  <button class="ctx-btn del" onclick="confirmDelMsg()">🗑 删除</button>
</div>
<div id="wbScreen">
  <div class="screen-header"><span onclick="closeWb()" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:26px;cursor:pointer;line-height:1">‹</span>共享世界书</div>
  <textarea id="wbText" placeholder="五角色共享的世界设定, 保存后下一轮回复生效"></textarea>
  <div id="wbBar"><button id="wbCancel" onclick="closeWb()">取消</button>
  <button id="wbSave" onclick="saveWb()">保存</button></div>
</div>
<script>
'use strict';
const CHARS=[
  {id:'xiazhou',name:'夏以昼',color:'#5b8def'},
  {id:'shenxinghui',name:'沈星回',color:'#9a7fd1'},
  {id:'lishen',name:'黎深',color:'#3fa8a0'},
  {id:'qiyu',name:'祁煜',color:'#e8834f'},
  {id:'qinche',name:'秦彻',color:'#c7515a'}];
const CMAP={};CHARS.forEach(c=>CMAP[c.id]=c);
function avatarHtml(cid,sz){const c=CMAP[cid]||{};   /* 切片5: 优先图片头像, 无则文字兜底 */
  return (c.avatar?`<img class="avatarImg" src="${BASE+c.avatar}" style="width:${sz}px;height:${sz}px" alt="${esc(c.name||cid)}">`
    :`<div class="avatar" style="background:${c.color};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.4)}px">${esc((c.name||cid).slice(-1))}</div>`)}
function avatarUser(sz){
  return (USER_AV?`<img class="avatarImg" src="${BASE+USER_AV}" style="width:${sz}px;height:${sz}px" alt="我">`
    :`<div class="avatar" style="background:#8a97a8;width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.4)}px">我</div>`)}
let digest=[],activeChar=null,sinceSeq={},rendered=new Set(),firstSeqInDom={},tick=0,sending=false,loadingHistory=false;
let errPills={};   /* 审计P0-1: seq->红!pill元素, 与poll.err_seqs对齐 */
let lastTsShown={};
const LS_READ='chatapp_read_seq';
const LS_CACHE_PREFIX='chatapp_msg_cache_';   /* 切片7: 本地离线消息骨架秒开 */
let ctxMenuTargetSeq=null;

/* ---- 切片7: 右键/长按弹出菜单管理 ---- */
function showCtxMenu(x,y,seq){
  ctxMenuTargetSeq=seq;
  const m=$('msgContextMenu'),mk=$('ctxMask');
  m.style.left=Math.min(window.innerWidth-60,Math.max(60,x))+'px';
  m.style.top=Math.max(10,y-45)+'px';
  m.style.display='block';
  mk.style.display='block';
}
function closeCtxMenu(){
  ctxMenuTargetSeq=null;
  $('msgContextMenu').style.display='none';
  $('ctxMask').style.display='none';
}
async function confirmDelMsg(){
  const seq=ctxMenuTargetSeq;
  closeCtxMenu();
  if(!seq||!activeChar)return;
  if(!confirm('确定要删除这条消息吗？（会同时从记忆中移除）'))return;
  try{
    const r=await api('/api/msg_del',{method:'POST',body:JSON.stringify({char_id:activeChar,seq:seq})});
    if(r.ok){
      const row=document.querySelector(`#msgArea .row[data-seq="${seq}"]`);
      if(row)row.remove();
      const pill=errPills[seq];
      if(pill){pill.remove();delete errPills[seq];}
      rendered.delete(seq);
      // 同步更新本地骨架缓存
      try{
        const raw=localStorage.getItem(LS_CACHE_PREFIX+activeChar);
        if(raw){
          const msgs=JSON.parse(raw).filter(m=>m.seq!==seq);
          localStorage.setItem(LS_CACHE_PREFIX+activeChar,JSON.stringify(msgs));
        }
      }catch(e){}
      toast('已删除');
    }
  }catch(e){toast('删除失败: '+e.message)}
}

function attachBubbleContextMenu(el,seq){
  if(!seq)return;
  let timer=null,startX=0,startY=0;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    timer=setTimeout(()=>{
      showCtxMenu(startX,startY,seq);
    },550);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!timer)return;
    const dx=Math.abs(e.touches[0].clientX-startX);
    const dy=Math.abs(e.touches[0].clientY-startY);
    if(dx>8||dy>8){clearTimeout(timer);timer=null;}
  },{passive:true});
  el.addEventListener('touchend',()=>{if(timer){clearTimeout(timer);timer=null;}},{passive:true});
  el.addEventListener('contextmenu',e=>{
    e.preventDefault();
    showCtxMenu(e.clientX,e.clientY,seq);
  });
}

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function readSeqMap(){try{return JSON.parse(localStorage.getItem(LS_READ)||'{}')}catch(e){return{}}}
function setReadSeq(cid,seq){const m=readSeqMap();if((m[cid]||0)<seq){m[cid]=seq;localStorage.setItem(LS_READ,JSON.stringify(m))}}
function fmtTime(ts){const d=new Date(ts*1000),n=new Date();
  const hm=d.toTimeString().slice(0,5);
  if(d.toDateString()===n.toDateString())return hm;
  return (d.getMonth()+1)+'-'+d.getDate()+' '+hm}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
/*BASE:BEGIN 单测标记: temp下node提取本段测试, 改动须同步单测*/
function calcBase(pathname){
  let p=pathname.replace(/\/+$/,'');                 /* 剥尾斜杠: /chat/ -> /chat */
  const last=p.substring(p.lastIndexOf('/')+1);
  if(last && last.indexOf('.')>=0) p=p.substring(0,p.lastIndexOf('/')); /* 末段像文件名才剥: /index.html -> '' */
  return p;
}
const BASE=calcBase(location.pathname);
/*BASE:END*/
async function api(path,opt){
  const o=Object.assign({},opt||{});
  const headers=Object.assign({},o.headers||{});
  if(!(o.body instanceof FormData)&&!headers['Content-Type']){
    headers['Content-Type']='application/json';
  }
  o.headers=headers;
  const r=await fetch(BASE+path,o);
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json()}

/* ---------- M2 世界书(五角色共享一份) ---------- */
async function openWb(){
  try{const r=await api('/api/worldbook');$('wbText').value=r.worldbook||''}
  catch(e){toast('世界书加载失败');return}
  $('wbScreen').style.display='flex';
}
function closeWb(){$('wbScreen').style.display='none'}
async function saveWb(){
  const btn=$('wbSave');btn.disabled=true;btn.textContent='保存中…';
  try{await api('/api/worldbook',{method:'PUT',body:JSON.stringify({worldbook:$('wbText').value})});
      toast('已保存, 下一轮回复生效');closeWb()}
  catch(e){toast('保存失败: '+e.message)}
  finally{btn.disabled=false;btn.textContent='保存'}
}

/* ---------- 切泡 §5.4 ---------- */
const OPEN_CLOSE={'(':')','（':'）','【':'】','[':']'};
const END_PUNCT=new Set(['。','！','？','…','~','!','?','．','〜','\n']);
const TAIL_GLUE=new Set(['」','』','"',"'",'）',')','】',']']);
function tokenize(text){
  const segs=[];let buf='';let i=0;const n=text.length;
  const flush=()=>{if(buf.trim())segs.push({text:buf,paren:false});buf=''};
  while(i<n){
    const ch=text[i];
    if(OPEN_CLOSE[ch]){
      flush();
      let depth=0,j=i,closed=false;
      while(j<n){const c=text[j];
        if(c===ch)depth++;
        else if(c===OPEN_CLOSE[ch]){depth--;if(depth===0){closed=true;break}}
        j++}
      if(closed){segs.push({text:text.slice(i,j+1),paren:true});i=j+1}
      else{segs.push({text:text.slice(i),paren:true});i=n}
    }else{buf+=ch;i++}
  }
  flush();
  return segs;
}
function splitNormal(t){
  const out=[];let cur='';
  for(let k=0;k<t.length;k++){
    const ch=t[k];cur+=ch;
    if(END_PUNCT.has(ch)){
      while(k+1<t.length&&(END_PUNCT.has(t[k+1])||TAIL_GLUE.has(t[k+1]))){cur+=t[++k]}
      out.push(cur);cur=''
    }
  }
  if(cur.trim())out.push(cur);
  return out;
}
function splitBubbles(text){
  text=(text||'').replace(/\n{2,}/g,'\n').trim();
  if(!text)return[{text:'……',paren:false}];
  let segs=[];
  tokenize(text).forEach(s=>{
    if(s.paren)segs.push(s);
    else splitNormal(s.text).forEach(x=>{const t=x.replace(/^[\n\s　]+/,'').replace(/[\n\s　]+$/,'');if(t)segs.push({text:t,paren:false})});
  });
  // <8字与下一段合并(括号泡不参与合并, 保持独立)
  let changed=true;
  while(changed){changed=false;
    for(let k=0;k<segs.length-1;k++){
      if(!segs[k].paren&&!segs[k+1].paren&&segs[k].text.replace(/\n/g,'').length<8){
        segs[k]={text:segs[k].text+'\n'+segs[k+1].text,paren:false};segs.splice(k+1,1);changed=true;break}}}
  // 上限6泡: 反复合并"最短相邻"普通对
  while(segs.length>6){
    let bi=-1,bl=1e9;
    for(let k=0;k<segs.length-1;k++){
      if(!segs[k].paren&&!segs[k+1].paren){
        const L=segs[k].text.length+segs[k+1].text.length;
        if(L<bl){bl=L;bi=k}}}
    if(bi<0)break;
    segs[bi]={text:segs[bi].text+'\n'+segs[bi+1].text,paren:false};segs.splice(bi+1,1);
  }
  return segs;
}

async function refreshDigest(){

    if(!localStorage.getItem(LS_READ)){
      try{const base={};digest.forEach(c=>{base[c.id]=c.last_seq||0});localStorage.setItem(LS_READ,JSON.stringify(base))}catch(e){}

/* ---------- 聊天屏 ---------- */
function appendRow(cid,msg,stagger){
  const area=$('msgArea');
  if(msg.ts-(lastTsShown[cid]||0)>300){
    const d=document.createElement('div');d.className='time-pill';
    d.innerHTML=`<span>${fmtTime(msg.ts)}</span>`;area.appendChild(d);
  }
  lastTsShown[cid]=msg.ts;
  if(msg.role==='system'){
    const d=document.createElement('div');d.className='sys-pill';
    d.innerHTML=`<span>${esc(msg.content)}</span>`;area.appendChild(d);
    rendered.add(msg.seq);scrollBottom();return;
  }
  const row=document.createElement('div');row.className='row '+msg.role;row.dataset.seq=msg.seq;
  attachBubbleContextMenu(row,msg.seq);   /* 切片7: 长按/右键气泡弹出删除菜单 */
  const av=document.createElement('div');
  av.innerHTML=(msg.role==='user')?avatarUser(38):avatarHtml(cid,38);   /* 切片5: 图片头像 */
  row.appendChild(av.firstChild);
  const wrap=document.createElement('div');wrap.className='bubbles';row.appendChild(wrap);
  area.appendChild(row);
  const mt=(msg.meta&&typeof msg.meta==='object')?msg.meta:{};
  if(msg.role==='user'&&mt.error){   /* M4: 失败消息红!pill, 点击重试 */
    const ep=document.createElement('div');ep.className='sys-pill errPill';
    ep.textContent='⚠ '+((typeof mt.error==='string'&&mt.error)?mt.error:'回复失败')+' · 点击重试';
    ep.onclick=()=>retryMsg(cid,msg.seq,ep);area.appendChild(ep);
    errPills[msg.seq]=ep;
  }
  if(msg.kind==='image_in'||msg.kind==='image_out'){   /* M3: 图片消息缩略图+识图注记 */
    const b=document.createElement('div');b.className='bubble';
    const im=document.createElement('img');im.className='pic';im.loading='lazy';im.src=BASE+(msg.media_path||'');
    im.onclick=()=>zoomImg(BASE+msg.media_path);b.appendChild(im);wrap.appendChild(b);
    if(mt.vision){const c=document.createElement('div');c.className='cap';c.textContent='👁 已识图';wrap.appendChild(c)}
  }else if(msg.kind==='voice'){                        /* S6: 自定义语音条(播放/进度/seek) */
    const b=document.createElement('div');b.className='bubble audio';
    const au=document.createElement('audio');au.preload='metadata';au.src=BASE+(msg.media_path||'');
    const btn=document.createElement('div');btn.className='vbtn';btn.textContent='▶';
    const trk=document.createElement('div');trk.className='vtrack';
    const fill=document.createElement('div');fill.className='vfill';trk.appendChild(fill);
    const dur=document.createElement('span');dur.className='vdur';dur.textContent=(mt.dur||0)+'"';
    btn.onclick=()=>{ if(au.paused){document.querySelectorAll('audio').forEach(x=>{if(x!==au)x.pause()});au.play().catch(()=>{})} else au.pause() };
    trk.onclick=e=>{const r=trk.getBoundingClientRect();if(au.duration){au.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*au.duration}};
    au.ontimeupdate=()=>{if(au.duration)fill.style.width=(au.currentTime/au.duration*100)+'%'};
    au.onended=()=>{fill.style.width='0%';btn.textContent='▶'};
    au.onplay=()=>btn.textContent='❚❚'; au.onpause=()=>btn.textContent='▶';
    au.onloadedmetadata=()=>{if(isFinite(au.duration)&&au.duration>0)dur.textContent=Math.round(au.duration)+'"'};
    b.appendChild(btn);b.appendChild(trk);b.appendChild(dur);b.appendChild(au);wrap.appendChild(b);
  }else{
  const parts=(msg.role==='user')?[{text:msg.content,paren:false}]:splitBubbles(msg.content);
  parts.forEach((p,i)=>{
    const b=document.createElement('div');b.className='bubble'+(p.paren?' paren':'');b.textContent=p.text;
    wrap.appendChild(b);
    if(stagger){b.style.display='none';
      setTimeout(()=>{b.style.display='block';scrollBottom()},i*300)}
  });
  }
  rendered.add(msg.seq);
  if(!firstSeqInDom[cid]||msg.seq<firstSeqInDom[cid])firstSeqInDom[cid]=msg.seq;
  scrollBottom();
}
function scrollBottom(){const a=$('msgArea');a.scrollTop=a.scrollHeight}
function applyMsgs(cid,msgs,stagger){
  if(loadingHistory&&stagger)return;   /* S1: 历史重建DOM期间跳过增量(sinceSeq不前移, 不丢消息) */
  msgs.forEach(m=>{if(!rendered.has(m.seq))appendRow(cid,m,stagger)});
  const last=msgs[msgs.length-1];
  if(last){sinceSeq[cid]=Math.max(sinceSeq[cid]||0,last.seq);setReadSeq(cid,last.seq)}
}
async function openChat(cid){
  activeChar=cid;
  $('listScreen').style.display='none';
  $('chatScreen').style.display='flex';
  $('chatTitle').textContent=CMAP[cid].name;
  $('chatAvatar').innerHTML=avatarHtml(cid,34);   /* 切片5: 图片头像 */
  $('msgArea').innerHTML='';rendered=new Set();errPills={};lastTsShown[cid]=0;firstSeqInDom[cid]=0;sinceSeq[cid]=0;   /* 热修1027: 此行切片5被误删→切换角色不清屏,五角色聊天互串;勿再动 */
  applyBg();

  /* 切片7: 骨架秒开 —— 先读本地离线缓存, 立即渲染无需等待网络 */
  try{
    const cached=localStorage.getItem(LS_CACHE_PREFIX+cid);
    if(cached){
      const msgs=JSON.parse(cached);
      if(Array.isArray(msgs)&&msgs.length){
        applyMsgs(cid,msgs,false);
      }
    }
  }catch(e){}

  try{
    const r=await api(`/api/history?char_id=${encodeURIComponent(cid)}&limit=50`);
    if(r.msgs&&r.msgs.length){
      applyMsgs(cid,r.msgs,false);
      // 写入骨架秒开缓存(只留最新50条)
      try{localStorage.setItem(LS_CACHE_PREFIX+cid,JSON.stringify(r.msgs.slice(-50)))}catch(e){}
    }else if(cid===activeChar){
      /* 清库1027-B: 服务端已无该角色消息(如清库后) → 清空DOM与本地骨架缓存, 防旧消息幽灵常驻屏幕 */
      $('msgArea').innerHTML='';rendered=new Set();errPills={};lastTsShown[cid]=0;firstSeqInDom[cid]=0;
      try{localStorage.removeItem(LS_CACHE_PREFIX+cid)}catch(e){}
    }
    $('typingHint').style.display='none';
  }catch(e){toast('加载失败');   /* 审计P2-1: 历史失败改拉全量, 防since=0把最旧200条当新消息渲染 */
    api(`/api/poll?char_id=${encodeURIComponent(cid)}&full=1`)
      .then(r=>{if(cid===activeChar&&r.msgs){
        applyMsgs(cid,r.msgs,false);
        try{localStorage.setItem(LS_CACHE_PREFIX+cid,JSON.stringify(r.msgs.slice(-50)))}catch(e){}
      }}).catch(()=>{});
    return;
  }
  pollOnce();
}
function closeChat(){
  const cid=activeChar,orphan=pending.slice();   /* P0-1: 切角色前撤回未发送的已上传图 */
  pending=[];renderAtt();
  if(cid)orphan.forEach(p=>{if(p.seq)api('/api/att_del',{method:'POST',body:JSON.stringify({char_id:cid,seq:p.seq})}).catch(()=>{})});
  activeChar=null;
  $('chatScreen').style.display='none';
  $('listScreen').style.display='flex';
  refreshDigest();
}
function syncErrPills(list){   /* P0-1: err_seqs=[{seq,error}]与DOM pill双向对齐 */
  const want=new Set(list.map(x=>x.seq));
  Object.keys(errPills).forEach(s=>{
    if(!want.has(+s)){const el=errPills[s];if(el&&el.parentNode)el.remove();delete errPills[s]}
  });
  list.forEach(x=>{
    if(errPills[x.seq])return;
    const rowEl=document.querySelector('#msgArea .row.user[data-seq="'+x.seq+'"]');
    if(!rowEl)return;   /* 行不在当前DOM(更早历史), 重进会话由历史渲染补 */
    const ep=document.createElement('div');ep.className='sys-pill errPill';
    ep.textContent='⚠ '+((x.error&&typeof x.error==='string')?x.error:'回复失败')+' · 点击重试';
    ep.onclick=()=>retryMsg(activeChar,x.seq,ep);
    rowEl.after(ep);errPills[x.seq]=ep;
  });
}
async function pollOnce(){
  if(!activeChar||loadingHistory)return;   /* S1: 历史加载中暂停增量轮询, 完成后下轮补齐, 消息不丢 */
  const cid=activeChar;
  try{
    const r=await api(`/api/poll?char_id=${encodeURIComponent(cid)}&since=${sinceSeq[cid]||0}`);
    if(cid!==activeChar)return;
    if(r.msgs&&r.msgs.length)applyMsgs(cid,r.msgs,true);
    if(r.err_seqs)syncErrPills(r.err_seqs);   /* P0-1: 与后端error集对齐(他端重试成功即撤pill) */
    $('typingHint').style.display=r.typing?'block':'none';
  }catch(e){}
}
/* 历史加载: 顶部触底拉50条, 重建DOM保持滚动位置 */
$('msgArea').addEventListener('scroll',async()=>{
  if(!activeChar||loadingHistory)return;
  if($('msgArea').scrollTop<60){
    const before=firstSeqInDom[activeChar];
    if(!before||before<=1)return;
    loadingHistory=true;
    try{
      const r=await api(`/api/history?char_id=${encodeURIComponent(activeChar)}&before_seq=${before}&limit=50`);
      if(r.msgs&&r.msgs.length){
        const area=$('msgArea'),h0=area.scrollHeight;
        area.innerHTML='';rendered=new Set();lastTsShown[activeChar]=0;firstSeqInDom[activeChar]=0;
        r.msgs.forEach(m=>appendRow(activeChar,m,false));
        area.scrollTop=area.scrollHeight-h0;
      }
    }catch(e){}
    loadingHistory=false;
  }
});
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,96)+'px'}

async function sendMsg(){

/* ---------- M4: 会话背景(切片5: 按角色分桶) + 失败重试 ---------- */
const LS_BG='chatapp_bg_all';
let bgCfgChar=null;   /* 切片5: 设置面板当前配置的目标角色 */
let USER_AV='';       /* 切片5: 我的头像(/api/config.avatar_user) */
function bgAll(){try{return JSON.parse(localStorage.getItem(LS_BG)||'{}')}catch(e){return{}}}
function bgState(cid){return bgAll()[cid||activeChar]||{mode:'none',value:''}}
function bgSave(cid,c){const a=bgAll();a[cid||activeChar]=c;localStorage.setItem(LS_BG,JSON.stringify(a))}
function applyBg(cid){const el=$('chatScreen');el.style.background='';
  const c=bgState(cid);
  if(c.mode==='image'&&c.value){
    const v=c.value+(c.value.includes('?')?'&':'?')+'_t='+(c.u_ts||Date.now());
    el.style.background='#f5f5f5 url("'+BASE+v+'") center/cover no-repeat';}}
function markBg(){const c=bgState(bgCfgChar),m=(c.mode==='color')?'none':(c.mode||'none');   /* 切片5R: 纯色退役, 遗留桶当none */
  $('bgNone').classList.toggle('on',m==='none');
  $('bgImgOpt').classList.toggle('on',m==='image');
  $('bgImgBtn').style.display=m==='image'?'block':'none'}
function buildBgCharRow(){const r=$('bgCharRow');if(!r)return;let h='';
  CHARS.forEach(c=>{const sel=(c.id===bgCfgChar);
    h+=`<span data-c="${c.id}" onclick="bgPickChar('${c.id}')" style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;margin:2px;border-radius:14px;cursor:pointer;border:1.5px solid ${sel?CMAP[c.id].color:'transparent'};font-size:13px">${avatarHtml(c.id,20)}${c.name}</span>`});
  r.innerHTML=h}
function bgPickChar(cid){bgCfgChar=cid;buildBgCharRow();markBg()}
function closeCfg(){$('cfgScreen').style.display='none'}
async function openCfg(){bgCfgChar=activeChar||CHARS[0].id;buildBgCharRow();markBg();$('cfgScreen').style.display='block';
  try{const r=await api('/api/config');if(r.avatar_user)USER_AV=r.avatar_user;
    if(r.bg_all){localStorage.setItem(LS_BG,JSON.stringify(r.bg_all));markBg();applyBg()}}
  catch(e){}}
async function fetchBgCfg(){try{const r=await api('/api/config');
  if(r.avatar_user)USER_AV=r.avatar_user;
  if(r.bg_all){localStorage.setItem(LS_BG,JSON.stringify(r.bg_all));try{localStorage.removeItem('chatapp_bg')}catch(e){}}
  applyBg()}catch(e){}}
async function bgPost(fd){const cid=bgCfgChar||activeChar||CHARS[0].id;fd.append('char_id',cid);
  try{const r=await api('/api/config/bg',{method:'POST',body:fd,headers:{}});
    const b=(r.bg&&r.bg.mode!==undefined)?r.bg:r;
    if(b&&b.mode!==undefined){
      b.u_ts=Date.now();
      bgSave(cid,b);applyBg(activeChar);markBg();toast('背景已更新')}}
  catch(e){toast('背景设置失败: '+e.message);throw e}}   /* 审计P2-6: 上抛供调用方回滚 */
function bgMode(m){const cid=bgCfgChar;
  if(m==='image'){$('bgImgFile').value='';$('bgImgFile').click();return}
  const c={mode:m,value:''};bgSave(cid,c);applyBg(activeChar);markBg();
  const fd=new FormData();fd.append('mode',m);bgPost(fd)}
function bgImgPick(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const cid=bgCfgChar,prev=localStorage.getItem(LS_BG);   /* 审计P2-6: 失败回滚到上传前 */
  inp.value='';   /* 允许连续选取同名文件 */
  toast('正在处理背景图…');

  /* 切片7: 手机端加速 —— Canvas前端压缩图片到最长边1920，导出webp/jpeg */
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const MAX=1920;
      if(w>MAX||h>MAX){
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}
        else{w=Math.round(w*MAX/h);h=MAX;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        const uploadBlob=blob||f;
        const uploadName=f.name.replace(/\.[^.]+$/,'.webp');
        toast('正在上传背景图…');
        const fd=new FormData();
        fd.append('mode','image');
        fd.append('file',uploadBlob,uploadName);
        bgPost(fd).catch(()=>{
          if(prev!==null){localStorage.setItem(LS_BG,prev);applyBg(activeChar);markBg()}
        });
      },'image/webp',0.85);
    };
    img.onerror=()=>{
      // 降级原图直接上传
      toast('正在上传背景图…');
      const fd=new FormData();fd.append('mode','image');fd.append('file',f,f.name);
      bgPost(fd).catch(()=>{if(prev!==null){localStorage.setItem(LS_BG,prev);applyBg(activeChar);markBg()}});
    };
    img.src=e.target.result;
  };
  reader.onerror=()=>{
    toast('正在上传背景图…');
    const fd=new FormData();fd.append('mode','image');fd.append('file',f,f.name);
    bgPost(fd).catch(()=>{if(prev!==null){localStorage.setItem(LS_BG,prev);applyBg(activeChar);markBg()}});
  };
  reader.readAsDataURL(f);
}
