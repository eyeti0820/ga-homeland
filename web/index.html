<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家园 · 便签墙</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="wall-vignette" aria-hidden="true"></div>

<header class="app-head">
  <div class="app-brand">
    <h1 class="app-title">家<span>园</span>便签墙</h1>
    <p class="app-sub">写句话贴上来，他们会看到的 · <span id="presence"></span></p>
  </div>
  <nav class="app-nav">
    <a class="on" href="index.html">便签墙</a>
    <a href="moments.html">朋友圈</a>
    <a href="diary.html">交换日记</a>
    <a href="forum.html">论坛</a>
  </nav>
</header>

<section class="composer" id="composer">
  <div class="composer-card">
    <textarea id="note-input" rows="2" maxlength="500"
      placeholder="给家里留句话……（署名：小墨）"></textarea>
    <div class="composer-bar">
      <div class="swatches" id="swatches" title="选一张纸的颜色"></div>
      <button id="post-btn" class="btn-pin">贴上去</button>
    </div>
  </div>
</section>

<main class="wall" id="wall" aria-live="polite">
  <p class="wall-empty" id="wall-empty">墙上还空着，来贴第一张吧</p>
</main>

<div class="sentinel" id="sentinel" hidden></div>

<footer class="app-foot">
  <span id="wall-meta">—</span>
</footer>

<script src="app.js?v=5"></script>
</body>
</html>
